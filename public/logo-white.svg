<svg viewBox="0 0 460 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Star Gradient -->
    <linearGradient id="fluxglow_star_grad_white" x1="50" y1="10" x2="50" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA480" />
      <stop offset="45%" stop-color="#E2B799" />
      <stop offset="100%" stop-color="#8DB596" />
    </linearGradient>
  </defs>

  <!-- ==================== LEFT EMBLEM: RADIANT STAR ==================== -->
  <g transform="translate(10, 5)">
    <!-- 8 Radiating Glow Rays (Pill/Capsule style) -->
    <!-- Top -->
    <line x1="55" y1="10" x2="55" y2="24" stroke="#FFA480" stroke-width="7" stroke-linecap="round" />
    <!-- Top-Right -->
    <line x1="88" y1="24" x2="78" y2="34" stroke="#FFA480" stroke-width="7" stroke-linecap="round" />
    <!-- Right -->
    <line x1="100" y1="57" x2="86" y2="57" stroke="#FFBD9E" stroke-width="7" stroke-linecap="round" />
    <!-- Bottom-Right -->
    <line x1="88" y1="90" x2="78" y2="80" stroke="#A7D4B0" stroke-width="7" stroke-linecap="round" />
    <!-- Bottom -->
    <line x1="55" y1="104" x2="55" y2="90" stroke="#8DB596" stroke-width="7" stroke-linecap="round" />
    <!-- Bottom-Left -->
    <line x1="22" y1="90" x2="32" y2="80" stroke="#8DB596" stroke-width="7" stroke-linecap="round" />
    <!-- Left -->
    <line x1="10" y1="57" x2="24" y2="57" stroke="#A7D4B0" stroke-width="7" stroke-linecap="round" />
    <!-- Top-Left -->
    <line x1="22" y1="24" x2="32" y2="34" stroke="#FFA480" stroke-width="7" stroke-linecap="round" />

    <!-- Central 4-pointed hollow glowing star -->
    <path
      d="M 55 28 
         C 55 43, 43 55, 28 57
         C 43 59, 55 71, 55 86
         C 55 71, 67 59, 82 57
         C 67 55, 55 43, 55 28 Z"
      fill="none"
      stroke="url(#fluxglow_star_grad_white)"
      stroke-width="7"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>

  <!-- ==================== RIGHT WORDMARK: FluxGlow ==================== -->
  <text 
    x="135" 
    y="78" 
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="62" 
    font-weight="800" 
    letter-spacing="-0.03em" 
    fill="#FFFFFF"
  >FluxGlow</text>

  <!-- Sprout Seedling above the 'w' -->
  <g transform="translate(393, 20)">
    <!-- Stem -->
    <path 
      d="M 22 55 Q 22 38 24 25" 
      stroke="#A7D4B0" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      fill="none" 
    />
    <!-- Left Leaf -->
    <path 
      d="M 23 35 C 10 32 0 20 6 6 C 18 10 24 22 23 35 Z" 
      fill="#A7D4B0" 
    />
    <!-- Right Leaf -->
    <path 
      d="M 24 28 C 30 14 42 6 54 8 C 56 22 42 32 24 28 Z" 
      fill="#C1E7C8" 
    />
  </g>
</svg>
